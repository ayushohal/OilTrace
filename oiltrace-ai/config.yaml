# =====================================================================
# OILTRACE AI - prototype configuration
# Every tunable number lives here. Nothing in the UI is hard-coded.
#
# `scenes` is a library of fully independent scenarios. Each has its own
# imagery, metocean field and AIS extract; they share no data. Switching
# scene re-runs the whole pipeline against different inputs.
#
# `adaptive_context` covers images with no matching scenario (uploads,
# external datasets): a metocean field and AIS extract are synthesised
# around the spill the system actually detected, so the full pipeline
# can still be demonstrated. This is labelled in the UI.
# =====================================================================

detection:
  mode_priority:
  - unet
  - reference_mask
  - image_processing
  model_path: models/unet_oilspill.onnx
  blur_kernel: 7
  min_region_pixels: 400
  dark_ratio: 0.62
  max_coverage_fraction: 0.6
  morph_kernel: 5
  confidence_weights:
    contrast: 0.45
    homogeneity: 0.3
    shape: 0.25
drift:
  wind_factor: 0.03
  wave_factor: 0.01
  timestep_minutes: 15
  spreading_rate_km_per_h: 4.0
  max_hindcast_hours: 12.0
  release_time_rounding_minutes: 30
  forward_hours:
  - 6
  - 12
  - 24
ais:
  candidate_radius_km: 20.0
  release_window_hours: 2.0
  ais_reporting_interval_minutes: 15
attribution:
  weights:
    proximity: 0.3
    temporal: 0.25
    trajectory: 0.2
    behaviour: 0.15
    ais_continuity: 0.1
  confidence_bands:
    high: 80.0
    medium: 60.0
